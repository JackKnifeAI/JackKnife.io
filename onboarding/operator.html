<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JackKnife Operator Review</title><link rel="stylesheet" href="styles.css"><style>.actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.actions button{width:auto}.danger{border-color:#ff6b6b;color:#ffb3b3}.warn{border-color:#fbbf24;color:#ffe9a8}textarea{min-height:90px}.statusbar{font-family:monospace;color:#98a3b5}</style></head><body><main class="shell"><div class="brand"><img src="../logo.svg" width="38"><div><b>JACKKNIFE</b><span> OPERATOR</span></div></div><section class="card"><div class="eyebrow">Client provisioning</div><h1>Agent Pipeline Review</h1><p class="lead">Review agent output, record a decision, and only then advance into deployment planning. Approval triggers planning agents only — never live infrastructure changes.</p><div class="grid"><label>Profile ID<input id="pid" placeholder="jk_..."></label><label>Operator token<input id="token" type="password" placeholder="operator token"></label></div><label>Decision note<textarea id="note" placeholder="Reason, required changes, or approval context"></textarea></label><div class="actions"><button id="load">Load review</button><button id="approve">Approve blueprint</button><button id="returnBtn" class="warn">Return for changes</button><button id="blockBtn" class="danger">Block</button><button id="execBtn">Approve safe execution</button><button id="infraReq">Request infrastructure auth</button><button id="integReq">Request integration auth</button><button id="acceptLink">Create acceptance link</button></div><p id="status" class="statusbar"></p><pre id="out"></pre></section></main><script>
async function api(path,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+token.value};let r=await fetch(path,opts);let x=await r.json();if(!r.ok)throw Error(x.error||'failed');return x}
async function loadReview(){status.textContent='Loading…';try{let x=await api('/api/operator/review?profile='+encodeURIComponent(pid.value));out.textContent=JSON.stringify(x,null,2);status.textContent='Loaded: '+x.profile.state}catch(e){status.textContent=e.message}}
async function act(action){if(!pid.value||!token.value)return status.textContent='Profile ID and operator token required.';status.textContent='Recording '+action+'…';try{let x=await api('/api/operator/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:pid.value,action,actor:'jackknife-operator',note:note.value})});status.textContent=action+' recorded: '+x.state;await loadReview()}catch(e){status.textContent=e.message}}
async function execApprove(){status.textContent='Approving safe execution…';try{let x=await api('/api/operator/execution-approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:pid.value,actor:'jackknife-operator',note:note.value})});status.textContent='Execution preflight queued: '+x.state;await loadReview()}catch(e){status.textContent=e.message}}
async function requestExternal(type){let provider=prompt('Provider/system name');if(!provider)return;try{let x=await api('/api/operator/external-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:pid.value,action_type:type,provider,note:note.value})});status.textContent='Authorization requested for '+provider;await loadReview()}catch(e){status.textContent=e.message}}
async function makeAcceptance(){try{let x=await api('/api/operator/acceptance-link',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile_id:pid.value})});status.textContent='Acceptance link: '+x.acceptance_path;out.textContent=JSON.stringify(x,null,2)}catch(e){status.textContent=e.message}}
load.onclick=loadReview;approve.onclick=()=>act('approve');returnBtn.onclick=()=>act('return');blockBtn.onclick=()=>act('block');execBtn.onclick=execApprove;infraReq.onclick=()=>requestExternal('infrastructure_provision');integReq.onclick=()=>requestExternal('integration_connect');acceptLink.onclick=makeAcceptance;
</script></body></html>
