<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JackKnife Client Acceptance</title><link rel="stylesheet" href="styles.css"></head><body><main class="shell"><div class="brand"><img src="../logo.svg" width="38"><div><b>JACKKNIFE</b><span> CLIENT ACCEPTANCE</span></div></div><section class="card"><div class="eyebrow">Final acceptance</div><h1>Accept your deployment</h1><p class="lead">Use this only after JackKnife has completed live validation and handed you the acceptance evidence. Your acceptance is recorded once and tied to the reviewed artifact.</p><label>Your name<input id="signer" autocomplete="name"></label><label>Acceptance note<textarea id="note" placeholder="Optional notes or conditions"></textarea></label><label>Acceptance evidence JSON<textarea id="artifact" placeholder='{"validation":"passed","version":"..."}'></textarea></label><button id="accept">Accept deployment</button><p id="status"></p><pre id="out"></pre></section></main><script>const token=new URLSearchParams(location.search).get('token')||'';accept.onclick=async()=>{if(!token)return status.textContent='Invalid acceptance link.';let evidence={};try{evidence=artifact.value?JSON.parse(artifact.value):{}}catch(e){return status.textContent='Acceptance evidence must be valid JSON.'}status.textContent='Recording acceptance…';let r=await fetch('/api/client/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,signer_name:signer.value,note:note.value,artifact:evidence})});let x=await r.json();if(!r.ok)return status.textContent=x.error||'Could not record acceptance';out.textContent=JSON.stringify(x,null,2);status.textContent='Acceptance recorded.'}</script></body></html>
